<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 Ежедневник</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📔</text></svg>">
<style>
  :root {
    --bg: #f0f2f5; --panel-bg: #ffffff; --panel-bg-alt: #fafafa; --text: #1c1e21;
    --text-muted: #65676b; --border: #eee; --border-strong: #ddd; --task-bg: #f7f8fa;
    --task-failed-bg: #fdecee; --task-failed-text: #c0392b; --accent: #1877f2;
    --accent-hover: #166fe5; --secondary: #e4e6eb; --secondary-hover: #d8dadf;
    --secondary-text: #1c1e21; --notes-bg: #fffbe6; --notes-text: #8a6d00;
    --warn-bg: #fff3cd; --warn-text: #856404; --shadow: rgba(0,0,0,0.08);
    --shadow-modal: rgba(0,0,0,0.3);
  }
  body.dark {
    --bg: #18191a; --panel-bg: #242526; --panel-bg-alt: #1e1f20; --text: #e4e6eb;
    --text-muted: #b0b3b8; --border: #3a3b3c; --border-strong: #4a4b4c; --task-bg: #3a3b3c;
    --task-failed-bg: #4a1f24; --task-failed-text: #ff8b9a; --accent: #2d88ff;
    --accent-hover: #1a7aff; --secondary: #3a3b3c; --secondary-hover: #4a4b4c;
    --secondary-text: #e4e6eb; --notes-bg: #3a3520; --notes-text: #ffd84d;
    --warn-bg: #4a3a1a; --warn-text: #ffd84d; --shadow: rgba(0,0,0,0.4);
    --shadow-modal: rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 10px; min-height: 100vh;
    transition: background 0.2s, color 0.2s;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin-bottom: 15px;
  }
  h1 { font-size: 22px; }
  .nav-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: var(--secondary); color: var(--secondary-text); }
  button.secondary:hover { background: var(--secondary-hover); }
  button.active { background: #42b72a; }
  button.active:hover { background: #36a420; }
  button.icon-btn { padding: 8px 10px; font-size: 16px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .month-view { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  @media (max-width: 900px) {
    .week { grid-template-columns: repeat(2, 1fr); }
    .month-view { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  }
  @media (max-width: 500px) {
    .week { grid-template-columns: 1fr; }
    .month-view { grid-template-columns: repeat(7, 1fr); gap: 3px; }
  }
  .day {
    background: var(--panel-bg); border-radius: 12px; padding: 12px;
    box-shadow: 0 1px 3px var(--shadow); display: flex; flex-direction: column;
    min-height: 220px;
  }
  .day.today { border: 2px solid var(--accent); }
  .day.past { background: var(--panel-bg-alt); }
  .day-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px;
  }
  .day-name { font-weight: 600; font-size: 14px; text-transform: capitalize; }
  .day-date { font-size: 12px; color: var(--text-muted); }
  .day.today .day-name { color: var(--accent); }
  .month-cell {
    background: var(--panel-bg); border-radius: 8px; padding: 6px; min-height: 90px;
    box-shadow: 0 1px 2px var(--shadow); display: flex; flex-direction: column;
    cursor: pointer; transition: 0.15s; overflow: hidden; font-size: 11px;
  }
  .month-cell:hover { background: var(--panel-bg-alt); }
  .month-cell.today { border: 2px solid var(--accent); }
  .month-cell.other-month { opacity: 0.4; }
  .month-cell-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;
  }
  .month-cell-date { font-weight: 700; font-size: 13px; }
  .month-cell.today .month-cell-date { color: var(--accent); }
  .month-cell-counts { font-size: 10px; color: var(--text-muted); }
  .month-cell-counts .c-done { color: #42b72a; }
  .month-cell-counts .c-failed { color: #e41e3f; }
  .month-cell-tasks {
    flex: 1; display: flex; flex-direction: column; gap: 2px; overflow: hidden;
  }
  .month-cell-task {
    font-size: 10px; line-height: 1.2; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: var(--text-muted);
  }
  .month-cell-task.done { text-decoration: line-through; color: #42b72a; opacity: 0.7; }
  .month-cell-task.failed { text-decoration: line-through; color: #e41e3f; opacity: 0.7; }
  .month-cell-more { font-size: 9px; color: var(--text-muted); text-align: center; }
  .month-header {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    margin-bottom: 6px; padding: 0 6px;
  }
  @media (max-width: 500px) { .month-header { gap: 3px; padding: 0 2px; } }
  .month-header div {
    text-align: center; font-size: 11px; color: var(--text-muted);
    font-weight: 600; text-transform: uppercase;
  }
  .tasks { flex: 1; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .task {
    display: flex; align-items: flex-start; gap: 6px; padding: 6px 8px;
    background: var(--task-bg); border-radius: 6px; font-size: 13px;
    word-break: break-word; transition: 0.15s;
  }
  .task.done { opacity: 0.55; }
  .task.done .task-text { text-decoration: line-through; color: var(--text-muted); }
  .task.failed { background: var(--task-failed-bg); }
  .task.failed .task-text {
    text-decoration: line-through; color: var(--task-failed-text);
  }
  .task-text { flex: 1; }
  .status-btns { display: flex; gap: 2px; flex-shrink: 0; margin-top: 1px; }
  .status-btn {
    background: none; border: none; padding: 0; width: 18px; height: 18px;
    font-size: 15px; line-height: 1; cursor: pointer; opacity: 0.35;
    transition: 0.15s; border-radius: 4px;
  }
  .status-btn:hover { opacity: 1; transform: scale(1.15); background: none; }
  .status-btn.on { opacity: 1; }
  .status-btn.done-on { color: #42b72a; }
  .status-btn.fail-on { color: #e41e3f; }
  .task-remove {
    background: none; border: none; color: var(--text-muted); padding: 0 4px;
    font-size: 16px; cursor: pointer; line-height: 1; flex-shrink: 0;
  }
  .task-remove:hover { color: #e41e3f; background: none; }
  .add-task { display: flex; gap: 4px; }
  .add-task input {
    flex: 1; padding: 6px 8px; border: 1px solid var(--border-strong);
    border-radius: 6px; font-size: 13px; min-width: 0;
    background: var(--panel-bg); color: var(--text);
  }
  .add-task input:focus { outline: none; border-color: var(--accent); }
  .add-task button { padding: 6px 10px; font-size: 13px; }
  .file-actions {
    display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center;
  }
  .file-actions label {
    display: inline-block; background: #42b72a; color: white; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .file-actions label:hover { background: #36a420; }
  .file-actions input[type="file"] { display: none; }
  .side-panel {
    position: fixed; top: 0; right: -440px; width: 420px; max-width: 92vw;
    height: 100vh; background: var(--panel-bg); color: var(--text);
    box-shadow: -4px 0 20px var(--shadow-modal); transition: right 0.3s ease;
    display: flex; flex-direction: column; z-index: 100;
  }
  .side-panel.open { right: 0; }
  .side-panel-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .side-panel-header h2 { font-size: 17px; }
  .side-panel-header .close-btn {
    background: none; border: none; font-size: 22px; color: var(--text-muted);
    padding: 4px 8px; cursor: pointer; line-height: 1;
  }
  .side-panel-header .close-btn:hover { color: #e41e3f; background: none; }
  .side-panel-body {
    flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 10px;
    overflow-y: auto;
  }
  .notes-panel-header { background: var(--notes-bg); }
  .notes-panel-header h2 { color: var(--notes-text); }
  .notes-panel-subtitle { font-size: 13px; color: var(--text-muted); }
  .notes-month-input {
    width: 100%; flex: 1; padding: 12px; border: 1px solid var(--border-strong);
    border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 1.5;
    resize: none; background: var(--notes-bg); color: var(--text); min-height: 200px;
  }
  .notes-month-input:focus { outline: none; border-color: #f0c419; }
  .notes-hint { font-size: 12px; color: var(--text-muted); text-align: center; }
  .stat-block {
    background: var(--task-bg); border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .stat-block h3 {
    font-size: 14px; margin-bottom: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .stat-row {
    display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--text-muted); }
  .stat-row .value { font-weight: 600; }
  .stat-done { color: #42b72a; }
  .stat-failed { color: #e41e3f; }
  .stat-active { color: var(--text); }
  .stat-bar {
    height: 8px; background: var(--secondary); border-radius: 4px; overflow: hidden;
    display: flex; margin-top: 8px;
  }
  .stat-bar-done { background: #42b72a; }
  .stat-bar-failed { background: #e41e3f; }
  .stat-bar-active { background: #f0c419; }
  .stat-month { margin-bottom: 14px; }
  .stat-month-title {
    font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text);
  }
  .search-input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong);
    border-radius: 8px; font-size: 14px; background: var(--panel-bg); color: var(--text);
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-results { flex: 1; overflow-y: auto; margin-top: 6px; }
  .search-result {
    padding: 10px; background: var(--task-bg); border-radius: 8px; margin-bottom: 8px;
    cursor: pointer; transition: 0.15s; border-left: 3px solid var(--accent);
  }
  .search-result:hover { background: var(--secondary); }
  .search-result-head {
    display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;
  }
  .search-result-date { color: var(--text-muted); }
  .search-result-status { font-size: 11px; padding: 1px 6px; border-radius: 10px; }
  .search-result-status.done { background: rgba(66,183,42,0.2); color: #42b72a; }
  .search-result-status.failed { background: rgba(228,30,63,0.2); color: #e41e3f; }
  .search-result-status.active { background: var(--secondary); color: var(--text-muted); }
  .search-result-text { font-size: 13px; word-break: break-word; }
  .search-result-text mark {
    background: #ffe69b; color: #333; padding: 0 2px; border-radius: 2px;
  }
  body.dark .search-result-text mark { background: #b08800; color: #fff; }
  .search-empty { text-align: center; color: var(--text-muted); padding: 30px 10px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3); opacity: 0;
    pointer-events: none; transition: opacity 0.3s; z-index: 99;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  body.dark .overlay { background: rgba(0,0,0,0.6); }
  .forgotten-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; z-index: 200; padding: 15px;
  }
  .forgotten-overlay.open { display: flex; }
  .forgotten-modal {
    background: var(--panel-bg); color: var(--text); border-radius: 14px;
    max-width: 600px; width: 100%; max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: 0 10px 40px var(--shadow-modal);
  }
  .forgotten-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--warn-bg); border-radius: 14px 14px 0 0;
  }
  .forgotten-header h2 {
    font-size: 18px; color: var(--warn-text); display: flex; align-items: center; gap: 8px;
  }
  .forgotten-header p { font-size: 13px; color: var(--warn-text); margin-top: 4px; }
  .forgotten-body { flex: 1; overflow-y: auto; padding: 12px 20px; }
  .forgotten-item {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
    background: var(--task-bg); border-radius: 8px; margin-bottom: 8px;
    border-left: 3px solid #f0c419; font-size: 14px;
  }
  .forgotten-item-date {
    font-size: 11px; color: var(--warn-text); background: var(--warn-bg);
    padding: 2px 6px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
  }
  .forgotten-item-text { flex: 1; word-break: break-word; }
  .forgotten-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .forgotten-item-actions button { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
  .btn-done { background: #42b72a; }
  .btn-done:hover { background: #36a420; }
  .btn-fail { background: #e41e3f; }
  .btn-fail:hover { background: #c81a35; }
  .forgotten-footer {
    padding: 12px 20px; border-top: 1px solid var(--border); display: flex;
    justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .fab-notes {
    position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px;
    border-radius: 50%; font-size: 24px; background: #f0c419; color: #333;
    box-shadow: 0 4px 12px var(--shadow-modal); display: none; z-index: 50;
  }
  .fab-notes:hover { background: #e0b309; }
  @media (max-width: 700px) {
    .fab-notes { display: block; }
    .notes-toggle-desktop { display: none; }
  }
  .overdue-badge {
    display: inline-flex; align-items: center; gap: 4px; background: var(--warn-bg);
    color: var(--warn-text); padding: 6px 12px; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #ffe69b;
    transition: 0.2s;
  }
  .overdue-badge:hover { filter: brightness(0.95); }
  .overdue-badge.hidden { display: none; }
  .auth-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel-bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  .auth-btn:hover { background: var(--secondary); }
  .auth-btn.logged-in {
    background: #e7f3e3; border-color: #b7ddb0; color: #2d6a1f;
  }
  body.dark .auth-btn.logged-in {
    background: #1f3a1c; border-color: #2f5a2a; color: #a3e096;
  }
  .auth-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid var(--border-strong);
  }
  .sync-status {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--text-muted); padding: 0 6px;
  }
  .sync-status .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #999;
  }
  .sync-status.online .dot { background: #42b72a; }
  .sync-status.syncing .dot { background: #f0c419; animation: pulse 1s infinite; }
  .sync-status.offline .dot { background: #e41e3f; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>📔 Ежедневник</h1>
  <div class="nav-buttons">
    <button class="secondary" id="btnPrev" onclick="shiftPeriod(-1)">←</button>
    <button class="secondary" onclick="goToday()">Сегодня</button>
    <button class="secondary" id="btnNext" onclick="shiftPeriod(1)">→</button>
    <button class="secondary" id="viewToggle" onclick="toggleView()">📅 Месяц</button>
    <span id="overdueBadge" class="overdue-badge hidden" onclick="showForgotten()">⚠️ <span id="overdueCount">0</span></span>
    <button class="icon-btn secondary" onclick="toggleSearch()" title="Поиск">🔍</button>
    <button class="icon-btn secondary" onclick="toggleStats()" title="Статистика">📊</button>
    <button class="secondary notes-toggle-desktop" onclick="toggleNotes()" title="Заметки на месяц">📝</button>
    <button class="icon-btn secondary" id="themeToggle" onclick="toggleTheme()" title="Тема">🌙</button>
    <button id="authBtn" class="auth-btn" onclick="handleAuth()">
      <span>🔑</span><span>Войти</span>
    </button>
    <span id="syncStatus" class="sync-status" style="display:none">
      <span class="dot"></span>
      <span id="syncText">—</span>
    </span>
  </div>
</div>

<div class="file-actions">
  <button onclick="exportData()">💾 Экспорт</button>
  <label>
    📂 Импорт
    <input type="file" accept=".json" onchange="importData(event)">
  </label>
</div>

<div id="viewWeek" class="view-container">
  <div class="week" id="week"></div>
</div>

<div id="viewMonth" class="view-container" style="display:none">
  <div class="month-header">
    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
  </div>
  <div class="month-view" id="monthView"></div>
</div>

<button class="fab-notes" onclick="toggleNotes()" title="Заметки на месяц">📝</button>
<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

<div class="side-panel" id="notesPanel">
  <div class="side-panel-header notes-panel-header">
    <h2>📝 Заметки на месяц</h2>
    <button class="close-btn" onclick="toggleNotes()">×</button>
  </div>
  <div class="side-panel-body">
    <div class="notes-panel-subtitle" id="notesMonthLabel"></div>
    <textarea id="monthNotesInput" class="notes-month-input"
      placeholder="Подсказки, идеи, важные напоминания на этот месяц…"></textarea>
    <div class="notes-hint">Автосохранение • привязано к месяцу</div>
  </div>
</div>

<div class="side-panel" id="statsPanel">
  <div class="side-panel-header">
    <h2>📊 Статистика</h2>
    <button class="close-btn" onclick="toggleStats()">×</button>
  </div>
  <div class="side-panel-body" id="statsBody"></div>
</div>

<div class="side-panel" id="searchPanel">
  <div class="side-panel-header">
    <h2>🔍 Поиск задач</h2>
    <button class="close-btn" onclick="toggleSearch()">×</button>
  </div>
  <div class="side-panel-body">
    <input type="text" id="searchInput" class="search-input"
      placeholder="Введите текст для поиска…" oninput="doSearch()">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="forgotten-overlay" id="forgottenOverlay">
  <div class="forgotten-modal">
    <div class="forgotten-header">
      <h2>⚠️ Забытые задачи</h2>
      <p>Активные задачи из прошлых дней. Отметь их: выполнены или провалены.</p>
    </div>
    <div class="forgotten-body" id="forgottenBody"></div>
    <div class="forgotten-footer">
      <button class="secondary" onclick="closeForgotten()">Отложить</button>
      <button onclick="markAllForgottenDone()">✅ Все выполнены</button>
    </div>
  </div>
</div>

<!-- ====== FIREBASE SDK (module) ====== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, signInWithPopup, GoogleAuthProvider,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getDatabase, ref, set, onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDAWPfVh-IjEWQNC_ZfmP9fiGRL8RYadQ",
  authDomain: "diadry.firebaseapp.com",
  databaseURL: "https://diadry-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "diadry",
  storageBucket: "diadry.firebasestorage.app",
  messagingSenderId: "196026548140",
  appId: "1:196026548140:web:3d62eedee025f744fdc409"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

// Экспортируем ВСЁ нужное в window, чтобы обычный <script> мог пользоваться
window.__fb = {
  auth, db, provider,
  signInWithPopup, onAuthStateChanged, signOut,
  ref, set, onValue
};
window.__fbReady = true;
window.dispatchEvent(new Event("fb-ready"));
</script>

<!-- ====== ОСНОВНОЙ КОД ====== -->
<script>
const STORAGE_KEY = "diary_data_v4";
const THEME_KEY = "diary_theme_v4";
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_SHORT = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const DAYS = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];

let data = loadData();
let weekOffset = 0;
let monthOffset = 0;
let viewMode = "week";
let openPanel = null;

let fbAuth = null;
let fbDb = null;
let fbProvider = null;
let currentUser = null;
let cloudRef = null;
let unsubscribeCloud = null;
let isSyncingFromCloud = false;
let pendingCloudSave = null;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { days: {}, monthNotes: {}, settings: {} };
    const parsed = JSON.parse(raw);
    return {
      days: parsed.days || {},
      monthNotes: parsed.monthNotes || {},
      settings: parsed.settings || {}
    };
  } catch { return { days: {}, monthNotes: {}, settings: {} }; }
}
function saveDataLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function saveData() { saveDataLocal(); scheduleCloudSave(); }

function setSyncStatus(status, text) {
  const el = document.getElementById("syncStatus");
  const txt = document.getElementById("syncText");
  if (!el || !txt) return;
  if (status === "hidden") { el.style.display = "none"; return; }
  el.style.display = "inline-flex";
  el.className = "sync-status " + status;
  txt.textContent = text;
}

function updateAuthButton() {
  const btn = document.getElementById("authBtn");
  if (!btn) return;
  if (currentUser) {
    const name = (currentUser.displayName || currentUser.email || "User").split(" ")[0];
    btn.classList.add("logged-in");
    btn.innerHTML = `
      <img class="auth-avatar" src="${currentUser.photoURL || ''}" alt="">
      <span>${escapeHtml(name)}</span>
    `;
    btn.title = "Нажми, чтобы выйти";
  } else {
    btn.classList.remove("logged-in");
    btn.innerHTML = `<span>🔑</span><span>Войти</span>`;
    btn.title = "Войти через Google";
  }
}

function handleAuth() {
  if (!fbAuth) {
    alert("Firebase ещё не загрузился. Подожди пару секунд и попробуй снова.");
    return;
  }
  if (currentUser) {
    if (confirm("Выйти из аккаунта? Данные останутся в облаке, но синхронизация остановится.")) {
      window.__fb.signOut(fbAuth);
    }
  } else {
    window.__fb.signInWithPopup(fbAuth, fbProvider).catch(err => {
      console.error("Ошибка входа:", err);
      alert("Не удалось войти: " + err.message);
    });
  }
}

function initFirebase() {
  fbAuth = window.__fb.auth;
  fbDb = window.__fb.db;
  fbProvider = window.__fb.provider;

  window.__fb.onAuthStateChanged(fbAuth, (user) => {
    currentUser = user;
    updateAuthButton();

    if (unsubscribeCloud) {
      unsubscribeCloud();
      unsubscribeCloud = null;
    }

    if (user) {
      setSyncStatus("syncing", "Подключение…");
      cloudRef = window.__fb.ref(fbDb, `users/${user.uid}/diary`);

      unsubscribeCloud = window.__fb.onValue(cloudRef, (snapshot) => {
        const cloudData = snapshot.val();
        isSyncingFromCloud = true;

        if (cloudData) {
          data = {
            days: cloudData.days || {},
            monthNotes: cloudData.monthNotes || {},
            settings: cloudData.settings || {}
          };
        } else {
          if (Object.keys(data.days).length > 0 || Object.keys(data.monthNotes).length > 0) {
            window.__fb.set(cloudRef, data);
          }
        }

        saveDataLocal();
        render();
        maybeShowReminder();
        setSyncStatus("online", "Синхронизировано");
        isSyncingFromCloud = false;
      }, (err) => {
        console.error("Ошибка чтения:", err);
        setSyncStatus("offline", "Ошибка: " + (err.code || err.message));
      });
    } else {
      cloudRef = null;
      setSyncStatus("hidden");
      data = loadData();
      render();
    }
  });
}

function scheduleCloudSave() {
  if (!currentUser || !cloudRef || isSyncingFromCloud) return;
  if (pendingCloudSave) clearTimeout(pendingCloudSave);
  setSyncStatus("syncing", "Сохранение…");
  pendingCloudSave = setTimeout(() => {
    if (!cloudRef) return;
    window.__fb.set(cloudRef, JSON.parse(JSON.stringify(data)))
      .then(() => setSyncStatus("online", "Синхронизировано"))
      .catch(err => {
        console.error("Ошибка записи:", err);
        setSyncStatus("offline", "Ошибка: " + (err.code || err.message));
      });
  }, 400);
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function monthKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function getMonday(offset) {
  const now = new Date();
  now.setHours(0,0,0,0);
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1 + offset * 7);
  return monday;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function getDay(key) {
  if (!data.days[key]) data.days[key] = { tasks: [] };
  if (!data.days[key].tasks) data.days[key].tasks = [];
  data.days[key].tasks.forEach(t => {
    if (!t.status) t.status = t.done ? "done" : "active";
    delete t.done;
  });
  return data.days[key];
}
function addTask(key, text) {
  text = text.trim();
  if (!text) return;
  getDay(key).tasks.push({ text, status: "active" });
  saveData(); render();
}
function setStatus(key, idx, status) {
  const t = getDay(key).tasks[idx];
  t.status = (t.status === status) ? "active" : status;
  saveData(); render(); updateOverdueBadge();
  if (openPanel === "stats") renderStats();
}
function removeTask(key, idx) {
  getDay(key).tasks.splice(idx, 1);
  saveData(); render(); updateOverdueBadge();
  if (openPanel === "stats") renderStats();
}

function applyTheme() {
  const theme = localStorage.getItem(THEME_KEY) || "light";
  document.body.classList.toggle("dark", theme === "dark");
  const btn = document.getElementById("themeToggle");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const cur = localStorage.getItem(THEME_KEY) || "light";
  localStorage.setItem(THEME_KEY, cur === "dark" ? "light" : "dark");
  applyTheme();
}

function toggleView() {
  viewMode = viewMode === "week" ? "month" : "week";
  document.getElementById("viewWeek").style.display = viewMode === "week" ? "" : "none";
  document.getElementById("viewMonth").style.display = viewMode === "month" ? "" : "none";
  document.getElementById("viewToggle").textContent = viewMode === "week" ? "📅 Месяц" : "🗓 Неделя";
  render();
}
function shiftPeriod(delta) {
  if (viewMode === "week") weekOffset += delta;
  else monthOffset += delta;
  render();
  if (openPanel === "notes") syncNotesMonth();
}
function goToday() {
  weekOffset = 0; monthOffset = 0;
  render();
  if (openPanel === "notes") syncNotesMonth();
}

function closeAllPanels() {
  ["notesPanel","statsPanel","searchPanel"].forEach(id => {
    document.getElementById(id).classList.remove("open");
  });
  document.getElementById("overlay").classList.remove("open");
  openPanel = null;
}
function openPanelById(id, kind) {
  if (openPanel === kind) { closeAllPanels(); return; }
  closeAllPanels();
  document.getElementById(id).classList.add("open");
  document.getElementById("overlay").classList.add("open");
  openPanel = kind;
}
function toggleNotes() {
  if (openPanel === "notes") { saveMonthNotes(); closeAllPanels(); return; }
  syncNotesMonth();
  openPanelById("notesPanel", "notes");
  setTimeout(() => document.getElementById("monthNotesInput").focus(), 100);
}
function toggleStats() {
  if (openPanel === "stats") { closeAllPanels(); return; }
  renderStats();
  openPanelById("statsPanel", "stats");
}
function toggleSearch() {
  if (openPanel === "search") { closeAllPanels(); return; }
  openPanelById("searchPanel", "search");
  setTimeout(() => document.getElementById("searchInput").focus(), 100);
}

let currentMonthKey = null;
function openNotesForMonth(mKey, label) {
  currentMonthKey = mKey;
  document.getElementById("notesMonthLabel").textContent = "Месяц: " + label;
  document.getElementById("monthNotesInput").value = data.monthNotes[mKey] || "";
}
function saveMonthNotes() {
  if (!currentMonthKey) return;
  data.monthNotes[currentMonthKey] = document.getElementById("monthNotesInput").value;
  saveData();
}
function syncNotesMonth() {
  saveMonthNotes();
  const monday = getMonday(weekOffset);
  const mKey = monthKey(monday);
  const label = `${MONTHS[monday.getMonth()]} ${monday.getFullYear()}`;
  openNotesForMonth(mKey, label);
}

function renderStats() {
  const body = document.getElementById("statsBody");
  body.innerHTML = "";
  let total = 0, done = 0, failed = 0, active = 0;
  const byMonth = {};
  for (const key in data.days) {
    const mKey = key.slice(0,7);
    if (!byMonth[mKey]) byMonth[mKey] = { done: 0, failed: 0, active: 0, total: 0 };
    for (const t of data.days[key].tasks) {
      total++; byMonth[mKey].total++;
      if (t.status === "done") { done++; byMonth[mKey].done++; }
      else if (t.status === "failed") { failed++; byMonth[mKey].failed++; }
      else { active++; byMonth[mKey].active++; }
    }
  }
  const general = document.createElement("div");
  general.className = "stat-block";
  general.innerHTML = `
    <h3>Всего</h3>
    <div class="stat-row"><span class="label">Задач создано</span><span class="value">${total}</span></div>
    <div class="stat-row"><span class="label">✅ Выполнено</span><span class="value stat-done">${done}</span></div>
    <div class="stat-row"><span class="label">❌ Провалено</span><span class="value stat-failed">${failed}</span></div>
    <div class="stat-row"><span class="label">⬜ Активных</span><span class="value stat-active">${active}</span></div>
    ${total > 0 ? `<div class="stat-bar">
      <div class="stat-bar-done" style="width:${done/total*100}%"></div>
      <div class="stat-bar-failed" style="width:${failed/total*100}%"></div>
      <div class="stat-bar-active" style="width:${active/total*100}%"></div>
    </div>` : ""}
  `;
  body.appendChild(general);

  const monthKeys = Object.keys(byMonth).sort().reverse();
  if (monthKeys.length > 0) {
    const monthBlock = document.createElement("div");
    monthBlock.className = "stat-block";
    const h = document.createElement("h3");
    h.textContent = "По месяцам";
    monthBlock.appendChild(h);
    for (const mKey of monthKeys) {
      const [y, m] = mKey.split("-");
      const stats = byMonth[mKey];
      const div = document.createElement("div");
      div.className = "stat-month";
      div.innerHTML = `
        <div class="stat-month-title">${MONTHS[+m-1]} ${y}</div>
        <div class="stat-row"><span class="label">Всего</span><span>${stats.total}</span></div>
        <div class="stat-row">
          <span class="label"><span class="stat-done">✅</span> / <span class="stat-failed">❌</span> / ⬜</span>
          <span>
            <span class="stat-done">${stats.done}</span> /
            <span class="stat-failed">${stats.failed}</span> /
            ${stats.active}
          </span>
        </div>
        ${stats.total > 0 ? `<div class="stat-bar">
          <div class="stat-bar-done" style="width:${stats.done/stats.total*100}%"></div>
          <div class="stat-bar-failed" style="width:${stats.failed/stats.total*100}%"></div>
          <div class="stat-bar-active" style="width:${stats.active/stats.total*100}%"></div>
        </div>` : ""}
      `;
      monthBlock.appendChild(div);
    }
    body.appendChild(monthBlock);
  }
}

function doSearch() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const results = document.getElementById("searchResults");
  results.innerHTML = "";
  if (!q) {
    results.innerHTML = '<div class="search-empty">Начните вводить текст…</div>';
    return;
  }
  const found = [];
  for (const key in data.days) {
    data.days[key].tasks.forEach((t, idx) => {
      if (t.text.toLowerCase().includes(q)) {
        found.push({ dateKey: key, idx, text: t.text, status: t.status });
      }
    });
  }
  found.sort((a,b) => b.dateKey.localeCompare(a.dateKey));
  if (found.length === 0) {
    results.innerHTML = '<div class="search-empty">Ничего не найдено 🕵️</div>';
    return;
  }
  found.forEach(item => {
    const [y,m,d] = item.dateKey.split("-");
    const dateStr = `${+d} ${MONTHS_GEN[+m-1]} ${y}`;
    const statusText = item.status === "done" ? "выполнено"
                     : item.status === "failed" ? "провалено" : "активно";
    const el = document.createElement("div");
    el.className = "search-result";
    const lower = item.text.toLowerCase();
    const start = lower.indexOf(q);
    const before = item.text.slice(0, start);
    const match = item.text.slice(start, start + q.length);
    const after = item.text.slice(start + q.length);
    el.innerHTML = `
      <div class="search-result-head">
        <span class="search-result-date">${dateStr}</span>
        <span class="search-result-status ${item.status}">${statusText}</span>
      </div>
      <div class="search-result-text">${escapeHtml(before)}<mark>${escapeHtml(match)}</mark>${escapeHtml(after)}</div>
    `;
    el.onclick = () => { jumpToDate(item.dateKey); closeAllPanels(); };
    results.appendChild(el);
  });
}
function jumpToDate(dateKey) {
  const d = new Date(dateKey + "T00:00:00");
  const now = new Date();
  now.setHours(0,0,0,0);
  const nowMonday = getMonday(0);
  const targetDay = d.getDay() || 7;
  const targetMonday = new Date(d);
  targetMonday.setDate(d.getDate() - targetDay + 1);
  const diffDays = Math.round((targetMonday - nowMonday) / (24*3600*1000));
  weekOffset = Math.round(diffDays / 7);
  monthOffset = (d.getFullYear() - now.getFullYear()) * 12 + (d.getMonth() - now.getMonth());
  render();
  if (openPanel === "notes") syncNotesMonth();
}

function getForgottenTasks() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayKey = dateKey(today);
  const result = [];
  for (const key in data.days) {
    if (key >= todayKey) continue;
    const tasks = data.days[key].tasks || [];
    tasks.forEach((t, idx) => {
      if (t.status === "active") result.push({ dateKey: key, idx, text: t.text });
    });
  }
  result.sort((a,b) => a.dateKey.localeCompare(b.dateKey));
  return result;
}
function updateOverdueBadge() {
  const list = getForgottenTasks();
  const badge = document.getElementById("overdueBadge");
  const count = document.getElementById("overdueCount");
  if (list.length > 0) {
    count.textContent = list.length;
    badge.classList.remove("hidden");
  } else {
    badge.classList.add("hidden");
  }
}
function showForgotten() {
  const list = getForgottenTasks();
  const body = document.getElementById("forgottenBody");
  body.innerHTML = "";
  if (list.length === 0) {
    body.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px">🎉 Просроченных задач нет!</p>';
  } else {
    list.forEach(item => {
      const [y, m, d] = item.dateKey.split("-");
      const dateStr = `${+d} ${MONTHS_SHORT[+m-1]}`;
      const el = document.createElement("div");
      el.className = "forgotten-item";
      el.innerHTML = `
        <span class="forgotten-item-date">${dateStr}</span>
        <span class="forgotten-item-text">${escapeHtml(item.text)}</span>
      `;
      const actions = document.createElement("div");
      actions.className = "forgotten-item-actions";
      const doneBtn = document.createElement("button");
      doneBtn.className = "btn-done";
      doneBtn.textContent = "✅";
      doneBtn.onclick = () => {
        data.days[item.dateKey].tasks[item.idx].status = "done";
        saveData(); showForgotten(); render(); updateOverdueBadge();
      };
      const failBtn = document.createElement("button");
      failBtn.className = "btn-fail";
      failBtn.textContent = "❌";
      failBtn.onclick = () => {
        data.days[item.dateKey].tasks[item.idx].status = "failed";
        saveData(); showForgotten(); render(); updateOverdueBadge();
      };
      actions.append(doneBtn, failBtn);
      el.appendChild(actions);
      body.appendChild(el);
    });
  }
  document.getElementById("forgottenOverlay").classList.add("open");
}
function closeForgotten() {
  document.getElementById("forgottenOverlay").classList.remove("open");
}
function markAllForgottenDone() {
  const list = getForgottenTasks();
  if (list.length === 0) { closeForgotten(); return; }
  if (!confirm(`Отметить все ${list.length} задач выполненными?`)) return;
  list.forEach(item => {
    data.days[item.dateKey].tasks[item.idx].status = "done";
  });
  saveData(); closeForgotten(); render(); updateOverdueBadge();
}
function maybeShowReminder() {
  const todayKey = dateKey(new Date());
  const last = data.settings.lastReminderDate;
  const forgotten = getForgottenTasks();
  if (forgotten.length > 0 && last !== todayKey) {
    data.settings.lastReminderDate = todayKey;
    saveData();
    setTimeout(showForgotten, 400);
  }
}

function render() {
  if (viewMode === "week") renderWeek();
  else renderMonth();
  updateOverdueBadge();
}
function renderWeek() {
  const monday = getMonday(weekOffset);
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayKey = dateKey(today);
  const weekEl = document.getElementById("week");
  weekEl.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    weekEl.appendChild(buildDayCell(d, todayKey));
  }
}
function buildDayCell(d, todayKey) {
  const key = dateKey(d);
  const day = getDay(key);
  const isToday = key === todayKey;
  const isPast = key < todayKey;
  const dayEl = document.createElement("div");
  dayEl.className = "day" + (isToday ? " today" : "") + (isPast ? " past" : "");
  const header = document.createElement("div");
  header.className = "day-header";
  header.innerHTML = `
    <span class="day-name">${DAYS[d.getDay()]}</span>
    <span class="day-date">${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}</span>
  `;
  dayEl.appendChild(header);
  const tasksEl = document.createElement("div");
  tasksEl.className = "tasks";
  day.tasks.forEach((task, idx) => tasksEl.appendChild(buildTaskEl(task, key, idx)));
  dayEl.appendChild(tasksEl);
  const addEl = document.createElement("div");
  addEl.className = "add-task";
  const inp = document.createElement("input");
  inp.type = "text";
  inp.placeholder = "Новая задача…";
  inp.onkeydown = (e) => { if (e.key === "Enter") { addTask(key, inp.value); inp.value = ""; } };
  const btn = document.createElement("button");
  btn.textContent = "+";
  btn.onclick = () => { addTask(key, inp.value); inp.value = ""; };
  addEl.append(inp, btn);
  dayEl.appendChild(addEl);
  return dayEl;
}
function buildTaskEl(task, key, idx) {
  const status = task.status || "active";
  const taskEl = document.createElement("div");
  taskEl.className = "task" + (status === "done" ? " done" : "") + (status === "failed" ? " failed" : "");
  const statusBtns = document.createElement("div");
  statusBtns.className = "status-btns";
  const doneBtn = document.createElement("button");
  doneBtn.className = "status-btn" + (status === "done" ? " on done-on" : "");
  doneBtn.textContent = "✅";
  doneBtn.title = "Выполнено";
  doneBtn.onclick = () => setStatus(key, idx, "done");
  const failBtn = document.createElement("button");
  failBtn.className = "status-btn" + (status === "failed" ? " on fail-on" : "");
  failBtn.textContent = "❌";
  failBtn.title = "Провалено";
  failBtn.onclick = () => setStatus(key, idx, "failed");
  statusBtns.append(doneBtn, failBtn);
  const span = document.createElement("span");
  span.className = "task-text";
  span.textContent = task.text;
  const del = document.createElement("button");
  del.className = "task-remove";
  del.textContent = "×";
  del.title = "Удалить";
  del.onclick = () => removeTask(key, idx);
  taskEl.append(statusBtns, span, del);
  return taskEl;
}
function renderMonth() {
  const now = new Date();
  const targetMonth = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = targetMonth.getFullYear();
  const month = targetMonth.getMonth();
  const first = new Date(year, month, 1);
  const firstDayIdx = (first.getDay() + 6) % 7;
  const start = new Date(first);
  start.setDate(first.getDate() - firstDayIdx);
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayKey = dateKey(today);
  const monthEl = document.getElementById("monthView");
  monthEl.innerHTML = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = dateKey(d);
    const day = getDay(key);
    const isToday = key === todayKey;
    const isOtherMonth = d.getMonth() !== month;
    const cell = document.createElement("div");
    cell.className = "month-cell" + (isToday ? " today" : "") + (isOtherMonth ? " other-month" : "");
    const doneC = day.tasks.filter(t => t.status === "done").length;
    const failC = day.tasks.filter(t => t.status === "failed").length;
    const head = document.createElement("div");
    head.className = "month-cell-header";
    head.innerHTML = `
      <span class="month-cell-date">${d.getDate()}</span>
      ${day.tasks.length > 0 ? `<span class="month-cell-counts">
        ${doneC ? `<span class="c-done">${doneC}✓</span>` : ""}
        ${failC ? `<span class="c-failed">${failC}✗</span>` : ""}
      </span>` : ""}
    `;
    cell.appendChild(head);
    const tasksWrap = document.createElement("div");
    tasksWrap.className = "month-cell-tasks";
    day.tasks.slice(0, 3).forEach(t => {
      const line = document.createElement("div");
      line.className = "month-cell-task" + (t.status === "done" ? " done" : "") + (t.status === "failed" ? " failed" : "");
      line.textContent = t.text;
      line.title = t.text;
      tasksWrap.appendChild(line);
    });
    if (day.tasks.length > 3) {
      const more = document.createElement("div");
      more.className = "month-cell-more";
      more.textContent = `+${day.tasks.length - 3} ещё`;
      tasksWrap.appendChild(more);
    }
    cell.appendChild(tasksWrap);
    cell.onclick = () => {
      jumpToDate(key);
      if (viewMode === "month") toggleView();
    };
    monthEl.appendChild(cell);
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const today = new Date().toISOString().slice(0,10);
  a.download = `diary-${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (confirm("Заменить текущие данные импортированными? (Отмена — объединить)")) {
        data = {
          days: imported.days || {},
          monthNotes: imported.monthNotes || {},
          settings: imported.settings || {}
        };
      } else {
        const impDays = imported.days || {};
        for (const key in impDays) {
          if (!data.days[key]) data.days[key] = { tasks: [] };
          data.days[key].tasks = data.days[key].tasks.concat(impDays[key].tasks || []);
        }
        const impNotes = imported.monthNotes || {};
        for (const key in impNotes) {
          if (!data.monthNotes[key]) data.monthNotes[key] = impNotes[key];
          else if (impNotes[key]) data.monthNotes[key] += "\n" + impNotes[key];
        }
      }
      saveData(); render();
      if (openPanel === "notes") syncNotesMonth();
      if (openPanel === "stats") renderStats();
      alert("✅ Импорт завершён!");
    } catch {
      alert("❌ Ошибка: файл повреждён или не является JSON.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

document.getElementById("monthNotesInput").addEventListener("input", saveMonthNotes);
window.addEventListener("beforeunload", saveMonthNotes);

applyTheme();
render();

window.addEventListener("fb-ready", initFirebase);
if (window.__fbReady) initFirebase();

setTimeout(maybeShowReminder, 1500);
</script>
